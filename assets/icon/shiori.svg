<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Shiori app icon: a paper bookmark (栞) with a vermilion cord and tassel on an indigo tile.
       Master artwork. Regenerate the PNG/ICO/ICNS files with assets/icon/build_icons.py. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#7484ff"/>
      <stop offset="1" stop-color="#3a3fb8"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f1e6d2"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="markShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="10" dy="18" stdDeviation="16" flood-color="#141650" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile (macOS grid: 824px square inset 100px) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tileShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>

  <g transform="translate(-28 6)">
    <g transform="rotate(-10 512 560)">
      <!-- bookmark with a swallow-tail end -->
      <path d="M392 300 Q392 282 410 282 H614 Q632 282 632 300 V820 L512 730 L392 820 Z"
            fill="url(#paper)" filter="url(#markShadow)"/>
      <!-- vermilion band -->
      <rect x="392" y="636" width="240" height="38" fill="#ff6b4a"/>
      <!-- punched hole -->
      <circle cx="512" cy="344" r="19" fill="#2f3399"/>
    </g>
    <!-- cord from the hole to the tassel (unrotated so the tassel hangs straight) -->
    <path d="M475 347 C 470 220, 640 170, 700 260 C 718 288, 724 318, 724 346"
          fill="none" stroke="#ff6b4a" stroke-width="18" stroke-linecap="round"/>
    <circle cx="724" cy="356" r="22" fill="#ff6b4a"/>
    <path d="M706 372 H742 L760 520 Q724 534 688 520 Z" fill="#ff6b4a"/>
    <g stroke="#d9452c" stroke-width="5" stroke-linecap="round" opacity="0.7">
      <path d="M712 400 L704 512"/>
      <path d="M724 400 L724 518"/>
      <path d="M736 400 L744 512"/>
    </g>
  </g>
</svg>
