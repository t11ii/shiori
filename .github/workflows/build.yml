name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Bundle macOS app
        if: runner.os == 'macOS'
        run: |
          cargo install cargo-bundle --locked
          cargo bundle --release --target ${{ matrix.target }}
          # Ad-hoc sign the whole bundle so Gatekeeper reports "unidentified
          # developer" (which the user can allow) instead of "damaged".
          codesign --force --deep --sign - target/${{ matrix.target }}/release/bundle/osx/Shiori.app
          cd target/${{ matrix.target }}/release/bundle/osx
          ditto -c -k --keepParent Shiori.app "$GITHUB_WORKSPACE/Shiori-${{ matrix.target }}.zip"
      - name: Package Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/shiori.exe -DestinationPath Shiori-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Shiori-${{ matrix.target }}
          path: Shiori-${{ matrix.target }}.zip

  # Pushing a tag like v0.1.0 publishes the zips on the GitHub Releases page.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Rename zips
        run: |
          v="${GITHUB_REF_NAME#v}"
          mv dist/Shiori-x86_64-pc-windows-msvc.zip "dist/Shiori-$v-windows-x64.zip"
          mv dist/Shiori-aarch64-apple-darwin.zip "dist/Shiori-$v-mac-apple-silicon.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Shiori $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
